name: Smoke test

# The release APK on an emulator: starts yt-dlp, opens a shared link, plays
# it and downloads it, then sends music to SFTP and FTP servers on the runner.
# Logs and screenshots are kept as the "smoke" artifact.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the release APK
        run: ./gradlew --console=plain :app:assembleRelease

      - name: Start an SFTP and an FTP server to send music to
        run: |
          docker run -d --name sftp -p 2222:22 atmoz/sftp kultr:kultr-pass:::music
          python3 -m venv /tmp/ftpenv
          /tmp/ftpenv/bin/pip install --quiet pyftpdlib
          nohup /tmp/ftpenv/bin/python .github/scripts/ftp-server.py > /tmp/ftp-server.log 2>&1 &
          for _ in $(seq 1 30); do nc -z 127.0.0.1 2121 && nc -z 127.0.0.1 2222 && break; sleep 1; done
          nc -z 127.0.0.1 2121 && nc -z 127.0.0.1 2222

      - name: Check the recommendation sources against the real services
        continue-on-error: true
        env:
          LIVE_SOURCES: "1"
        run: ./gradlew --console=plain :core:test --tests 'app.kultr.dl.core.LiveSourcesTest'

      - name: Start a Navidrome with a few songs and plays
        timeout-minutes: 10
        run: |
          image=deluan/navidrome:latest
          timeout 300 docker pull -q "$image"
          mkdir -p /tmp/nd/data /tmp/nd/music
          # Short tagged songs, made with the ffmpeg that comes in Navidrome's image.
          while IFS='|' read -r artist album title; do
            mkdir -p "/tmp/nd/music/$artist/$album"
            timeout 60 docker run --rm --entrypoint ffmpeg -v /tmp/nd/music:/music "$image" -nostdin -loglevel error \
              -f lavfi -i "sine=frequency=440:duration=35" -metadata artist="$artist" -metadata album_artist="$artist" \
              -metadata album="$album" -metadata title="$title" -metadata genre="Electronic" -q:a 9 "/music/$artist/$album/$title.mp3"
          done <<'SONGS'
          Daft Punk|Discovery|One More Time
          Daft Punk|Discovery|Aerodynamic
          Massive Attack|Mezzanine|Teardrop
          Air|Moon Safari|Sexy Boy
          Portishead|Dummy|Roads
          SONGS
          find /tmp/nd/music -name '*.mp3'
          sudo chmod -R a+rwX /tmp/nd
          docker run -d --name navidrome -p 4533:4533 -v /tmp/nd/music:/music:ro -v /tmp/nd/data:/data \
            -e ND_DEVAUTOCREATEADMINPASSWORD=kultr-pass -e ND_SCANNER_SCHEDULE=1m "$image"
          api="http://127.0.0.1:4533/rest"
          auth="u=admin&p=kultr-pass&v=1.16.1&c=ci&f=json"
          songs() { curl -s --max-time 10 "$api/search3.view?$auth&query=&songCount=50" || true; }
          n=0
          for _ in $(seq 1 60); do
            n=$(songs | python3 -c 'import sys,json; print(len(json.load(sys.stdin)["subsonic-response"].get("searchResult3",{}).get("song",[])))' 2>/dev/null || echo 0)
            [ "$n" -ge 5 ] && break
            sleep 3
          done
          echo "Navidrome has $n songs"
          [ "$n" -ge 5 ] || { docker logs navidrome 2>&1 | tail -30; exit 1; }
          # Play them a few times, so there is history to learn from.
          for id in $(songs | python3 -c 'import sys,json; print(" ".join(s["id"] for s in json.load(sys.stdin)["subsonic-response"]["searchResult3"]["song"]))'); do
            for _ in 1 2 3; do curl -s --max-time 10 "$api/scrobble.view?$auth&id=$id&submission=true" >/dev/null || true; done
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/smoke-test.sh

      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: smoke/
          if-no-files-found: ignore
