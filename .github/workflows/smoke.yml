name: Smoke test

# The release APK on an emulator: starts yt-dlp, opens a shared link, plays
# it and downloads it, then sends music to SFTP and FTP servers on the runner.
# Logs and screenshots are kept as the "smoke" artifact.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the release APK
        run: ./gradlew --console=plain :app:assembleRelease

      - name: Start an SFTP and an FTP server to send music to
        run: |
          docker run -d --name sftp -p 2222:22 atmoz/sftp kultr:kultr-pass:::music
          python3 -m venv /tmp/ftpenv
          /tmp/ftpenv/bin/pip install --quiet pyftpdlib
          nohup /tmp/ftpenv/bin/python .github/scripts/ftp-server.py > /tmp/ftp-server.log 2>&1 &
          for _ in $(seq 1 30); do nc -z 127.0.0.1 2121 && nc -z 127.0.0.1 2222 && break; sleep 1; done
          nc -z 127.0.0.1 2121 && nc -z 127.0.0.1 2222

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/smoke-test.sh

      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: smoke/
          if-no-files-found: ignore
