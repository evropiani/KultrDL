name: Release

# Publishes signed APKs as a GitHub release. Either push a tag like v1.0.0
# (matching versionName in app/build.gradle.kts), or run this workflow from
# the Actions tab with that tag: a tag that does not exist yet is created on
# the commit the run was started from.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, e.g. v1.0.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build from the tag if it already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --detach "$TAG"
          fi
          echo "TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check the tag matches the app version
        run: |
          VERSION="${TAG#v}"
          NAME=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$VERSION" != "$NAME" ]; then
            echo "::error::Tag $TAG does not match versionName \"$NAME\" in app/build.gradle.kts."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # A private key, when one is set up as repository secrets, replaces
      # the public release key in signing/ (see README → Signing).
      - name: Private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KULTRDL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kultrdl.p12"
            echo "KULTRDL_KEYSTORE_FILE=$RUNNER_TEMP/kultrdl.p12" >> "$GITHUB_ENV"
            echo "Signing with the private key from repository secrets."
          else
            echo "Signing with the public release key in signing/."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build the release APKs
        env:
          KULTRDL_KEYSTORE_PASSWORD: ${{ secrets.KULTRDL_KEYSTORE_PASSWORD }}
          KULTRDL_KEY_ALIAS: ${{ secrets.KULTRDL_KEY_ALIAS }}
        run: ./gradlew --console=plain :core:test :app:assembleRelease

      - name: Verify and name the APKs
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" | head -5
            abi=$(basename "$apk" .apk | sed -e 's/^app-//' -e 's/-release$//')
            cp "$apk" "dist/KultrDL-$VERSION-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist
          rm -f "$RUNNER_TEMP/kultrdl.p12"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then set -- --notes-file "$NOTES"; else set -- --generate-notes; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "KultrDL $VERSION" --target "$TARGET" "$@"
          fi
